version: "3"
services:
  db:
    image: postgres:18.0
    restart: unless-stopped
    ports:
      - 5434:5432
    env_file:
      - .env
    volumes:
      - ./init-multi-postgres-databases.sh:/docker-entrypoint-initdb.d/init-multi-postgres-databases.sh

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "5080:8080"
    depends_on:
      - db
